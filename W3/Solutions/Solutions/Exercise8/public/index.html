<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express Static Server</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Welcome to Exercise 08</h1>
        <p>This HTML file is being served automatically by <code>express.static()</code>.</p>
        <p>No manual route was written for this file — Express found it in the <strong>public/</strong> folder!</p>
        <img src="logo.png" alt="Logo placeholder" onerror="this.style.display='none'" />
    </div>
</body>
</html>
